<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ bot_title }}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="site-header">
  <a href="{{ url_for('home') }}" class="brand">
    <span class="brand-mark">✚</span>
    <span>{{ bot_title }}</span>
  </a>
  <nav>
    <a href="{{ url_for('home') }}">تصفح المحتوى</a>
    <a href="{{ url_for('admin_dashboard') }}">لوحة الأدمن</a>
  </nav>
</header>
<main>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="flash">{% for m in messages %}<p>{{ m }}</p>{% endfor %}</div>
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer class="site-footer">
  <p>محتوى الفرقة التالتة — تمريض. للمساهمة أو طلب المساعدة استخدم بوت التليجرام.</p>
</footer>
</body>
</html>
