{% extends "base.html" %}
{% block content %}
<div class="login-box">
  <h1 style="font-size:1.4rem">دخول الأدمن</h1>
  <form method="post" class="form-box" style="margin-bottom:0;">
    <label>الباسورد</label>
    <input type="password" name="password" required autofocus>
    <div style="margin-top:16px;">
      <button class="btn" type="submit">دخول</button>
    </div>
  </form>
</div>
{% endblock %}
